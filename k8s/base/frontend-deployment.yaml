apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: campus-events
  labels:
    app: campus-events-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-events-frontend
  template:
    metadata:
      labels:
        app: campus-events-frontend
    spec:
      containers:
      - name: frontend
        image: campus-events/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: campus-events-config
        - secretRef:
            name: campus-events-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 20
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false

