apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: campus-events

resources:
  - ../../base

labels:
  - pairs:
      environment: production
      app.kubernetes.io/managed-by: kustomize

images:
  - name: LOCATION-docker.pkg.dev/PROJECT_ID/campus-events-repo/backend
    newTag: production
  - name: LOCATION-docker.pkg.dev/PROJECT_ID/campus-events-repo/frontend
    newTag: production
